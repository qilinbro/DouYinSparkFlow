name: DouYin Spark Flow Schedule Run

on:
  workflow_dispatch:
    inputs:
      validate_only:
        description: "只检查配置和浏览器，不向好友发送消息"
        type: boolean
        default: true
        required: true
      test_once:
        description: "实际运行时只试发一条，确认回执后再使用完整任务"
        type: boolean
        default: false
        required: false
      qr_login:
        description: "在 GitHub 云端扫码登录，并只向指定好友试发一条"
        type: boolean
        default: false
        required: false
  schedule:
    - cron: "0 1 * * *" # 每天北京时间 09:00；GitHub 可能延迟启动

permissions:
  contents: read
  actions: read

concurrency:
  group: douyin-spark-flow-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-main:
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 40
    runs-on: ubuntu-latest
    environment: user-data
    env:
      # 仅传入应用所需配置，不批量导出 Secrets，也不生成包含 Cookie 的 .env。
      TASKS: ${{ vars.TASKS }}
      COOKIES_35503009597: ${{ secrets.COOKIES_35503009597 }}
      CLOUD_AUTH_KEY: ${{ secrets.CLOUD_AUTH_KEY }}
      CLOUD_EXPECTED_UID: ${{ vars.CLOUD_EXPECTED_UID }}
      CLOUD_AUTH_DIR: ${{ (inputs.qr_login || vars.CLOUD_AUTH_ENABLED == 'true') && '.cloud-auth' || '' }}
      PROXY_ADDRESS: ${{ vars.PROXY_ADDRESS }}
      MESSAGE_TEMPLATE: ${{ vars.MESSAGE_TEMPLATE || '续火花' }}
      HITOKOTO_TYPES: ${{ vars.HITOKOTO_TYPES || '["文学","影视","诗词","哲学"]' }}
      MATCH_MODE: ${{ vars.MATCH_MODE || 'nickname' }}
      # 新版上游统一用秒；BROWSER_TIMEOUT（毫秒）已不再读取。
      BROWSER_ACTION_TIMEOUT: ${{ vars.BROWSER_ACTION_TIMEOUT || '120' }}
      FRIEND_LIST_WAIT_TIME: ${{ vars.FRIEND_LIST_WAIT_TIME || '2' }}
      IM_SCAN_TIMEOUT: ${{ vars.IM_SCAN_TIMEOUT || '120' }}
      IM_READY_TIMEOUT: ${{ vars.IM_READY_TIMEOUT || '120' }}
      IM_MAX_STEPS: ${{ vars.IM_MAX_STEPS || '200' }}
      TASK_RETRY_TIMES: ${{ vars.TASK_RETRY_TIMES || '3' }}
      LOG_LEVEL: ${{ vars.LOG_LEVEL || 'Info' }}
      TEST_MAX_SENDS: ${{ inputs.test_once && '1' || '0' }}
      # 版本与校验值必须与 Dockerfile 同步。
      CLOAK_CHROMIUM_VERSION: "146.0.7680.177.5"
      CLOAK_BINARY_SHA256: "4a12bcde95fa1bb1beef2b41ab5e5c27c36be78e3be3d0dac8c64d705216670e"
      CLOAKBROWSER_AUTO_UPDATE: "false"
      DEBUG: "false"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Prepare cloud login paths
        if: inputs.qr_login || vars.CLOUD_AUTH_ENABLED == 'true'
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write(f'CLOUD_AUTH_DIR={root / "cloud-auth"}\n')
              output.write(f'CLOUD_LOGIN_DIR={root / "cloud-login"}\n')
          PY

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Validate account configuration
        run: python utils/validate_action_config.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run regression tests
        run: python -m unittest tests.test_douyin_im tests.test_logger tests.test_matching_guard tests.test_delivery_guards tests.test_task_results tests.test_receipt_diagnostics tests.test_cloud_auth tests.test_cloud_login tests.test_restore_cloud_auth

      - name: Install Chromium system dependencies
        run: python -m playwright install-deps chromium

      # 与上游一致补齐 Windows 字体；下载失败只告警，不阻断任务。
      - name: Install Windows default fonts
        continue-on-error: true
        shell: bash
        run: |
          set -e
          font_dir="$(mktemp -d "${RUNNER_TEMP}/windows-fonts.XXXXXX")"
          mkdir -p "${font_dir}/extracted"
          curl -fL --connect-timeout 15 --max-time 600 --retry 2 --retry-delay 3 \
            -o "${font_dir}/fonts.tar.gz" \
            https://github.com/ErwinLiYH/all_win10_fonts/archive/refs/heads/main.tar.gz
          tar -xzf "${font_dir}/fonts.tar.gz" -C "${font_dir}/extracted"
          sudo mkdir -p /usr/share/fonts/truetype/windows
          count=0
          while IFS= read -r -d '' font; do
            sudo cp -n "$font" /usr/share/fonts/truetype/windows/ && count=$((count + 1))
          done < <(find "${font_dir}/extracted" -type f \( -iname "*.ttf" -o -iname "*.ttc" -o -iname "*.otf" \) -print0)
          sudo fc-cache -f >/dev/null 2>&1 || true
          echo "Installed $count Windows font files"
          fc-list | grep -qiE 'segoe ui|microsoft yahei|simsun|calibri' \
            && echo "Windows fonts are ready" \
            || echo "::warning::Required Windows font families were not detected"

      - name: Download verified CloakBrowser Chromium
        shell: bash
        run: |
          set -euo pipefail
          download_dir="$(mktemp -d "${RUNNER_TEMP}/cloakbrowser-download.XXXXXX")"
          archive="${download_dir}/browser.tar.gz"
          extract_dir="${download_dir}/extracted"
          binary_dir="${RUNNER_TEMP}/cloakbrowser"
          tag="chromium-v${CLOAK_CHROMIUM_VERSION}"
          url="https://github.com/CloakHQ/CloakBrowser/releases/download/${tag}/cloakbrowser-linux-x64.tar.gz"
          curl -fL --connect-timeout 15 --max-time 600 --retry 2 --retry-delay 2 \
            -o "${archive}" "${url}"
          printf '%s  %s\n' "${CLOAK_BINARY_SHA256}" "${archive}" | sha256sum -c -
          mkdir -p "${extract_dir}" "${binary_dir}"
          tar -xzf "${archive}" -C "${extract_dir}"
          chrome="$(find "${extract_dir}" -maxdepth 6 -type f -name chrome -perm -u+x -print -quit)"
          test -n "${chrome}" || { echo "chrome binary not found in archive" >&2; exit 1; }
          # Chromium 依赖同目录的 ICU、.pak、locales 等，不能只复制 chrome。
          cp -a "$(dirname "${chrome}")/." "${binary_dir}/"
          chmod +x "${binary_dir}/chrome"
          test -f "${binary_dir}/icudtl.dat" || { echo "icudtl.dat is missing" >&2; exit 1; }
          "${binary_dir}/chrome" --version
          printf 'CLOAKBROWSER_BINARY_PATH=%s\n' "${binary_dir}/chrome" >> "${GITHUB_ENV}"

      - name: Check browser startup
        run: |
          python - <<'PY'
          from core.browser import get_browser
          browser = get_browser()
          if browser is None:
              raise RuntimeError("CloakBrowser 启动失败。")
          try:
              page = browser.new_page()
              page.goto(
                  "data:text/html,<title>Browser check</title>",
                  wait_until="domcontentloaded",
                  timeout=15000,
              )
              assert page.title() == "Browser check"
          finally:
              browser.close()
          print("应用 CloakBrowser 启动检查通过；未登录抖音或发送消息。")
          PY

      - name: Check browser input without sending
        env:
          RUN_BROWSER_INPUT_TESTS: "1"
        run: python -m unittest tests.test_browser_input

      - name: Restore encrypted cloud login
        if: (github.event_name == 'schedule' || !inputs.validate_only) && !inputs.qr_login && env.CLOUD_AUTH_DIR != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m utils.restore_cloud_auth

      - name: Set up cloud login transport
        if: inputs.qr_login && !inputs.validate_only
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Install cloud login artifact client
        if: inputs.qr_login && !inputs.validate_only
        run: npm ci --prefix tools/cloud-artifacts --ignore-scripts --no-audit --no-fund

      - name: Log in and test once in GitHub cloud
        if: inputs.qr_login && !inputs.validate_only
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8, Node 24
        env:
          CLOUD_LOGIN_VIEW_KEY: ${{ secrets.CLOUD_LOGIN_VIEW_KEY }}
          CLOUD_LOGIN_TARGET: "繁华，尽."
          MESSAGE_TEMPLATE: "续火花测试"
          TEST_MAX_SENDS: "1"
        with:
          script: |
            const path = require('node:path');
            await require(path.join(process.env.GITHUB_WORKSPACE, 'tools/cloud_artifacts.cjs')).login(core);

      - name: Run DouYin Spark Flow
        if: (github.event_name == 'schedule' || !inputs.validate_only) && !inputs.qr_login
        run: python main.py task

      - name: Save encrypted cloud login
        if: ${{ !cancelled() && (github.event_name == 'schedule' || !inputs.validate_only) && env.CLOUD_AUTH_DIR != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cloud-auth-state-${{ github.run_id }}
          path: ${{ env.CLOUD_AUTH_DIR }}/*.bin
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload run logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: run-logs-${{ github.run_id }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 7
